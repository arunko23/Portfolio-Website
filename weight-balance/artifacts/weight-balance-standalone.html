<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AS350 B3e Weight &amp; Balance – Figure 1/3</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2a3548;
      --fg: #e8eef7;
      --muted: #8b9bb4;
      --accent: #c44536;
      --accent-dark: #7a2a22;
      --input-bg: #0d1219;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      overflow-y: auto;
    }
    .panel h1 {
      font-size: 1.05rem;
      margin: 0 0 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .panel h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 1.25rem 0 0.5rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      align-items: center;
    }
    input[type="number"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      padding: 0.45rem 0.6rem;
      font-size: 0.95rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      padding: 0.45rem 0.4rem;
      font-size: 0.85rem;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 0.5rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: #e8eef7;
      color: #0f1419;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .btn-primary:hover { background: #fff; }
    .btn-secondary {
      background: var(--input-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      flex: 1;
    }
    .btn-danger {
      background: #3d1a1a;
      color: #f5a5a0;
      border: 1px solid #5c2a2a;
      flex: 1;
    }
    .checks { margin: 1rem 0; }
    .checks label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--fg);
      cursor: pointer;
    }
    .checks input { accent-color: var(--accent); }
    .current {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.8rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .current div { display: flex; justify-content: space-between; margin: 0.2rem 0; }
    .zone {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .zone.ballast { background: #1a3d2a; color: #8fdbb0; }
    .zone.noballast { background: #3d2a1a; color: #dbb08f; }
    .main {
      padding: 1rem;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
    }
    .note {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 42rem;
    }
    .chart-wrap {
      background: #fff;
      border-radius: 8px;
      overflow: auto;
      border: 1px solid var(--border);
      max-height: min(78vh, 920px);
    }
    .chart-stage {
      position: relative;
      line-height: 0;
    }
    .chart-stage img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }
    .chart-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .legend {
      background: #fff;
      color: #111;
      border-top: 1px solid #ddd;
      padding: 0.75rem 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.8rem;
    }
    .legend h3 {
      margin: 0 0 0.4rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #666;
      font-weight: 600;
      font-family: inherit;
    }
    .legend ul { margin: 0; padding: 0; list-style: none; }
    .legend li { margin: 0.15rem 0; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h1>Weight &amp; CG</h1>

      <h2>Plot a point</h2>
      <label>Weight</label>
      <div class="row">
        <input type="number" id="weight" value="1200" step="0.1" min="1000" max="1600" />
        <select id="weightUnit">
          <option value="kg">kg</option>
          <option value="lb">lb</option>
        </select>
      </div>
      <label>CG / Balance</label>
      <div class="row">
        <input type="number" id="cg" value="3500" step="0.1" min="3300" max="3650" />
        <select id="cgUnit">
          <option value="mm">mm</option>
          <option value="in">in</option>
        </select>
      </div>
      <button class="btn-primary" id="plotBtn">Plot point</button>
      <div class="row">
        <button class="btn-secondary" id="clearLast">Clear last</button>
        <button class="btn-danger" id="clearAll">Clear all</button>
      </div>

      <div class="checks">
        <label><input type="checkbox" id="connect" checked /> Connect plotted points</label>
        <label><input type="checkbox" id="crosshair" /> Show crosshair</label>
        <label><input type="checkbox" id="showCgLine" checked /> Show CG line (bottom to top)</label>
      </div>

      <h2>Current point</h2>
      <div class="current" id="currentInfo">
        <div><span>Weight</span><span id="curW">—</span></div>
        <div><span>CG</span><span id="curCg">—</span></div>
        <div id="zoneBadge"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <button class="btn-secondary" id="zoomOut" style="width:auto">Zoom −</button>
          <button class="btn-secondary" id="zoomIn" style="width:auto">Zoom +</button>
          <button class="btn-secondary" id="zoomReset" style="width:auto">Reset</button>
        </div>
        <p class="note">
          Overlay only — CG follows printed line from bottom to the point; after the intersection it continues up-right
          parallel to the left-side grid lines (like ①②). Horizontal weight line continues rightward.
        </p>
      </div>
      <div class="chart-wrap">
        <div class="chart-stage" id="stage">
          <img id="chartImg" alt="AS350 B3e AMM Figure 1/3 weight and balance graph" />
          <canvas id="overlay"></canvas>
        </div>
        <div class="legend" id="legend" style="display:none">
          <h3>Plotted points</h3>
          <ul id="legendList"></ul>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---- Geometry (from chart-geometry.ts) ----
    const CHART = {
      imageWidth: 1150,
      imageHeight: 910,
      plotLeft: 270,
      plotRight: 1138,

      plotBottom: 785,

      drawTop: 240,
      drawBottom: 812,
      weightMin: 1000,
      weightMax: 1600,
      cgMin: 3300,
      cgMax: 3650,
    };

    const TOP_CG = [
      [3350, 380],[3360, 401],[3370, 423],[3380, 445],[3390, 467],
      [3400, 488],[3410, 510],[3420, 532],[3430, 553],[3440, 574],
      [3450, 596],[3460, 617],[3470, 639],[3480, 661],[3490, 683],
      [3500, 705],[3532, 769],[3550, 812],[3565, 856],[3600, 920],[3650, 1029],
    ];
    const BOTTOM_CG = [
      [3350, 313],[3360, 349],[3370, 383],[3380, 418],[3390, 453],
      [3400, 488],[3410, 523],[3420, 557],[3430, 592],[3440, 628],
      [3450, 662],[3460, 698],[3470, 732],[3480, 767],[3490, 800],
      [3500, 837],[3532, 940],[3550, 1011],[3565, 1083],[3600, 1186],[3650, 1366],
    ];
    const WEIGHT_Y = [
      [1000, 267],[1025, 289],[1050, 310],[1075, 332],[1100, 354],
      [1119.5, 369],[1125, 375],[1150, 397],[1175, 418],[1200, 439],
      [1225, 461],[1250, 482],[1275, 504],[1300, 525],[1325, 548],
      [1350, 569],[1375, 591],[1400, 611],[1425, 634],[1450, 655],
      [1475, 677],[1500, 697],[1525, 719],[1550, 741],[1575, 762],[1600, 785],
    ];

    const LB_PER_KG = 2.2046226218;
    const MM_PER_IN = 25.4;

    function interp(table, v) {
      if (table.length < 2) return table[0]?.[1] ?? 0;
      if (v <= table[0][0]) {
        const [a, b] = [table[0], table[1]];
        return a[1] + ((v - a[0]) * (b[1] - a[1])) / (b[0] - a[0]);
      }
      for (let i = 0; i < table.length - 1; i++) {
        if (v <= table[i + 1][0]) {
          const a = table[i], b = table[i + 1];
          return a[1] + ((v - a[0]) * (b[1] - a[1])) / (b[0] - a[0]);
        }
      }
      const a = table[table.length - 2], b = table[table.length - 1];
      return a[1] + ((v - a[0]) * (b[1] - a[1])) / (b[0] - a[0]);
    }
    function topX(cgMm) { return interp(TOP_CG, cgMm); }
    function bottomX(cgMm) { return interp(BOTTOM_CG, cgMm); }
    function yOfWeight(w) { return interp(WEIGHT_Y, w); }
    function xAtY(cgMm, y) {
      const t = (y - CHART.plotTop) / (CHART.plotBottom - CHART.plotTop);
      return topX(cgMm) + t * (bottomX(cgMm) - topX(cgMm));
    }
    function pos(weightKg, cgMm) {
      const y = yOfWeight(weightKg);
      return { x: xAtY(cgMm, y), y };
    }
    function cgLine(cgMm) {
      return {
        top: { x: xAtY(cgMm, CHART.tickTopY), y: CHART.tickTopY },
        bottom: { x: xAtY(cgMm, CHART.tickBottomY), y: CHART.tickBottomY },
      };
    }
    function noBallastLeftX(y) {
      const t = Math.max(0, Math.min(1, (y - 350) / (700 - 350)));
      return 813 + 99 * t + 10 * t * (1 - t);
    }
    function noBallastRightX(y) {
      const t = Math.max(0, Math.min(1, (y - 350) / (700 - 350)));
      return 850 + 220 * t + 7 * t * (1 - t);
    }
    function isNoBallast(x, y) {
      return x >= noBallastLeftX(y) && x <= noBallastRightX(y);
    }

    let zoom = 1;

    function kgToLb(kg) { return kg * LB_PER_KG; }
    function mmToIn(mm) { return mm / MM_PER_IN; }

    function getInputs() {
      let w = parseFloat(document.getElementById("weight").value);
      let cg = parseFloat(document.getElementById("cg").value);
      if (document.getElementById("weightUnit").value === "lb") w = w / LB_PER_KG;
      if (document.getElementById("cgUnit").value === "in") cg = cg * MM_PER_IN;
      return { weightKg: w, cgMm: cg };
    }

    function updateCurrent() {
      const { weightKg, cgMm } = getInputs();
      const p = pos(weightKg, cgMm);
      document.getElementById("curW").textContent =
        weightKg.toFixed(1) + " kg  (" + kgToLb(weightKg).toFixed(1) + " lb)";
      document.getElementById("curCg").textContent =
        cgMm.toFixed(1) + " mm  (" + mmToIn(cgMm).toFixed(3) + " in)";
      const zone = isNoBallast(p.x, p.y) ? "NO BALLAST" : "BALLAST";
      const badge = document.getElementById("zoneBadge");
      badge.innerHTML = '<span class="zone ' + (zone === "BALLAST" ? "ballast" : "noballast") + '">' + zone + " zone</span>";
    }

    function draw() {
      const w = CHART.imageWidth;
      const h = CHART.imageHeight;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const connect = document.getElementById("connect").checked;
      const crosshair = document.getElementById("crosshair").checked;
      const showCgLine = document.getElementById("showCgLine").checked;

      function haloStroke(drawFn, color, width, haloW) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = OVERLAY.halo;
        ctx.lineWidth = haloW || width + 3.2;
        ctx.globalAlpha = 0.92;
        drawFn();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.globalAlpha = 1;
        drawFn();
        ctx.restore();
      }

      // Connect points
      if (connect && points.length > 1) {
        ctx.save();
        ctx.setLineDash([10, 6]);
        haloStroke(() => {
          ctx.beginPath();
          const first = pos(points[0].weightKg, points[0].cgMm);
          ctx.moveTo(first.x, first.y);
          for (let i = 1; i < points.length; i++) {
            const p = pos(points[i].weightKg, points[i].cgMm);
            ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }, OVERLAY.connect, 2.4, 5.4);
        ctx.restore();
      }

      // CG construction + horizontal weight lines
      // After the intersection point the CG line continues UP-RIGHT
      // parallel to the left-side printed lines (like the green ①② annotations).
      if (showCgLine) {
        // Reference slope for "parallel to 01,02..." = slope of 3350 mm line (up-right)
        const refTopX = topX(3350);
        const refBotX = bottomX(3350);
        const refDy = CHART.plotBottom - CHART.plotTop;
        const refDx = refBotX - refTopX; // negative → / slope
        const parallelSlope = refDx / refDy; // dx/dy

        const seen = new Set();
        for (const p of points) {
          const key = p.cgMm.toFixed(3);
          if (seen.has(key)) continue;
          seen.add(key);

          const pt = pos(p.weightKg, p.cgMm);
          const line = cgLine(p.cgMm);

          // Lower segment: bottom tick → plotted point (correct printed CG slope)
          haloStroke(() => {
            ctx.beginPath();
            ctx.moveTo(line.bottom.x, line.bottom.y);
            ctx.lineTo(pt.x, pt.y);
            ctx.stroke();
          }, OVERLAY.plot, 2.4, 5.4);

          // Upper segment: from plotted point upward, parallel to 01/02 lines (up-right)
          const dyUp = CHART.tickTopY - pt.y; // negative
          const dxUp = parallelSlope * dyUp;  // positive → rightward
          const topX2 = pt.x + dxUp;
          haloStroke(() => {
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
            ctx.lineTo(topX2, CHART.tickTopY);
            ctx.stroke();
          }, OVERLAY.plot, 2.4, 5.4);
        }
        for (const p of points) {
          const pt = pos(p.weightKg, p.cgMm);
          // Horizontal weight line continues RIGHTWARD past the intersection
          haloStroke(() => {
            ctx.beginPath();
            ctx.moveTo(CHART.plotLeft, pt.y);
            ctx.lineTo(CHART.plotRight, pt.y);
            ctx.stroke();
          }, OVERLAY.plot, 1.6, 4);
        }
      }

      // Points + optional crosshair
      for (const p of points) {
        const pt = pos(p.weightKg, p.cgMm);
        if (crosshair) {
          ctx.save();
          ctx.setLineDash([7, 6]);
          haloStroke(() => {
            ctx.beginPath();
            ctx.moveTo(CHART.plotLeft, pt.y);
            ctx.lineTo(pt.x, pt.y);
            ctx.stroke();
          }, OVERLAY.cross, 1.4, 3.6);
          ctx.restore();
        }
        // marker
        ctx.save();
        ctx.fillStyle = OVERLAY.halo;
        ctx.strokeStyle = OVERLAY.ink;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = OVERLAY.plot;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = OVERLAY.ink;
        ctx.font = "bold 11px IBM Plex Sans, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.strokeStyle = OVERLAY.halo;
        ctx.lineWidth = 3;
        ctx.strokeText(String(p.id), pt.x, pt.y - 12);
        ctx.fillText(String(p.id), pt.x, pt.y - 12);
        ctx.restore();
      }

      // Legend
      if (points.length === 0) {
        legend.style.display = "none";
      } else {
        legend.style.display = "block";
        legendList.innerHTML = points.map(p =>
          `<li>P${p.id}  ${p.weightKg.toFixed(1)} kg  ${kgToLb(p.weightKg).toFixed(1)} lb  ${p.cgMm.toFixed(1)} mm  ${mmToIn(p.cgMm).toFixed(3)} in</li>`
        ).join("");
      }
    }

    function applyZoom() {
      stage.style.width = (CHART.imageWidth * zoom) + "px";
      stage.style.height = (CHART.imageHeight * zoom) + "px";
      draw();
    }

    document.getElementById("plotBtn").onclick = () => {
      const { weightKg, cgMm } = getInputs();
      if (isNaN(weightKg) || isNaN(cgMm)) return;
      points.push({ id: nextId++, weightKg, cgMm });
      draw();
      updateCurrent();
    };
    document.getElementById("clearLast").onclick = () => {
      points.pop();
      if (points.length === 0) nextId = 1;
      draw();
    };
    document.getElementById("clearAll").onclick = () => {
      points = [];
      nextId = 1;
      draw();
    };
    ["connect", "crosshair", "showCgLine"].forEach(id => {
      document.getElementById(id).onchange = draw;
    });
    document.getElementById("zoomIn").onclick = () => { zoom = Math.min(3, zoom + 0.25); applyZoom(); };
    document.getElementById("zoomOut").onclick = () => { zoom = Math.max(0.5, zoom - 0.25); applyZoom(); };
    document.getElementById("zoomReset").onclick = () => { zoom = 1; applyZoom(); };
    ["weight", "cg", "weightUnit", "cgUnit"].forEach(id => {
      document.getElementById(id).oninput = updateCurrent;
      document.getElementById(id).onchange = updateCurrent;
    });

    img.onload = () => {
      applyZoom();
      updateCurrent();
    };
    // In case already cached
    if (img.complete) {
      applyZoom();
      updateCurrent();
    }
  </script>
</body>
</html>
