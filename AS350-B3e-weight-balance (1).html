function interp(table, v) {
  if (v <= table[0][0]) { const a=table[0], b=table[1]; return a[1]+((v-a[0])*(b[1]-a[1]))/(b[0]-a[0]); }
  for (let i=0;i<table.length-1;i++) if (v <= table[i+1][0]) { const a=table[i], b=table[i+1]; return a[1]+((v-a[0])*(b[1]-a[1]))/(b[0]-a[0]); }
  const a=table[table.length-2], b=table[table.length-1];
  return a[1]+((v-a[0])*(b[1]-a[1]))/(b[0]-a[0]);
}
function topX(cg){ return interp(TOP_CG, cg); }
function bottomX(cg){ return interp(BOTTOM_CG, cg); }
function yOfWeight(w){ return interp(WEIGHT_Y, w); }
function xAtY(cg, y){ const t=(y-CHART.plotTop)/(CHART.plotBottom-CHART.plotTop); return topX(cg)+t*(bottomX(cg)-topX(cg)); }
function pos(w, cg){ const y=yOfWeight(w); return { x:xAtY(cg,y), y }; }
function clipSegment(a,b,xMin,xMax,yMin,yMax){
  let t0=0,t1=1; const dx=b.x-a.x, dy=b.y-a.y;
  const clip=(p,q)=>{ if(p===0) return q>=0; const r=q/p; if(p<0){ if(r>t1)return false; if(r>t0)t0=r; } else { if(r<t0)return false; if(r<t1)t1=r; } return true; };
  if (clip(-dx,a.x-xMin)&&clip(dx,xMax-a.x)&&clip(-dy,a.y-yMin)&&clip(dy,yMax-a.y)) {
    const p0={x:a.x+t0*dx,y:a.y+t0*dy}, p1={x:a.x+t1*dx,y:a.y+t1*dy};
    return p0.y<=p1.y ? {top:p0,bottom:p1} : {top:p1,bottom:p0};
  }
  return null;
}
function cgLineToPoint(cg, pt){
  const bottom={ x:xAtY(cg, CHART.tickBottomY), y:CHART.tickBottomY };
  return clipSegment(bottom, pt, CHART.drawLeft, CHART.drawRight, CHART.drawTop, CHART.drawBottom);
}
function indexRayFromPoint(pt){
  const yTop=CHART.plotTop;
  const xAtTop=pt.x + INDEX_DX_DY*(yTop-pt.y);
  const clipped=clipSegment(pt, {x:xAtTop,y:yTop}, CHART.plotLeft, CHART.plotRight, CHART.plotTop, CHART.plotBottom);
  if(!clipped) return null;
  return { start: clipped.bottom, end: clipped.top };
}

function noBallastRightX(y){ const t=Math.max(0,Math.min(1,(y-350)/(700-350))); return 850+220*t+7*t*(1-t); }
function isNoBallast(x,y){ return x>=noBallastLeftX(y) && x<=noBallastRightX(y); }

function kgToLb(kg){ return kg*LB_PER_KG; }
function mmToIn(mm){ return mm/MM_PER_IN; }

let prevWeightUnit = "kg";
document.getElementById("weightUnit").addEventListener("change", () => {
  const wEl = document.getElementById("weight");
  let val = parseFloat(wEl.value);
  if (!isNaN(val)) {
    if (document.getElementById("weightUnit").value === "lb" && prevWeightUnit === "kg") {
      wEl.value = (val * LB_PER_KG).toFixed(1);
    } else if (document.getElementById("weightUnit").value === "kg" && prevWeightUnit === "lb") {
      wEl.value = (val / LB_PER_KG).toFixed(1);
    }
  }
  prevWeightUnit = document.getElementById("weightUnit").value;
  updateCurrent();
});

let prevCgUnit = "mm";
document.getElementById("cgUnit").addEventListener("change", () => {
  const cgEl = document.getElementById("cg");
  let val = parseFloat(cgEl.value);
  if (!isNaN(val)) {
    if (document.getElementById("cgUnit").value === "in" && prevCgUnit === "mm") {
      cgEl.value = (val / MM_PER_IN).toFixed(3);
    } else if (document.getElementById("cgUnit").value === "mm" && prevCgUnit === "in") {
      cgEl.value = (val * MM_PER_IN).toFixed(1);
    }
  }
  prevCgUnit = document.getElementById("cgUnit").value;
  updateCurrent();
});

function getInputs(){
  let w=parseFloat(document.getElementById("weight").value);
  let cg=parseFloat(document.getElementById("cg").value);
  if(document.getElementById("weightUnit").value==="lb") w=w/LB_PER_KG;
  if(document.getElementById("cgUnit").value==="in") cg=cg*MM_PER_IN;
  return { weightKg:w, cgMm:cg };
}
function updateCurrent(){
  const {weightKg,cgMm}=getInputs();
  if (isNaN(weightKg) || isNaN(cgMm)) return;
  const p=pos(weightKg,cgMm);
  document.getElementById("curW").textContent=weightKg.toFixed(1)+" kg  ("+kgToLb(weightKg).toFixed(1)+" lb)";
  document.getElementById("curCg").textContent=cgMm.toFixed(1)+" mm  ("+mmToIn(cgMm).toFixed(3)+" in)";
  const zone=isNoBallast(p.x,p.y)?"NO BALLAST":"BALLAST";
  document.getElementById("zoneBadge").innerHTML='<span class="zone '+(zone==="BALLAST"?"ballast":"noballast")+'">'+zone+' zone</span>';
}
function haloStroke(ctx, drawFn, color, width, haloW){
  ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=OVERLAY.halo; ctx.lineWidth=haloW||width+3.2; ctx.globalAlpha=0.92; drawFn();
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.globalAlpha=1; drawFn();
  ctx.restore();
}
function drawTo(ctx){
  const connect=document.getElementById("connect").checked;
  const crosshair=document.getElementById("crosshair").checked;
  const showCgLine=document.getElementById("showCgLine").checked;
  if(connect && points.length>1){
    ctx.save(); ctx.setLineDash([10,6]);
    haloStroke(ctx, ()=>{
      ctx.beginPath();
      const f=pos(points[0].weightKg, points[0].cgMm);
      ctx.moveTo(f.x,f.y);
      for(let i=1;i<points.length;i++){ const p=pos(points[i].weightKg, points[i].cgMm); ctx.lineTo(p.x,p.y); }
      ctx.stroke();
    }, OVERLAY.connect, 2.4, 5.4);
    ctx.restore();
  }
  if(showCgLine){
    for(const p of points){
      const pt=pos(p.weightKg,p.cgMm);
      const lower=cgLineToPoint(p.cgMm, pt);
      if(lower) haloStroke(ctx, ()=>{ ctx.beginPath(); ctx.moveTo(lower.bottom.x, lower.bottom.y); ctx.lineTo(lower.top.x, lower.top.y); ctx.stroke(); }, OVERLAY.plot, 2.4, 5.4);
      const upper=indexRayFromPoint(pt);
      if(upper) haloStroke(ctx, ()=>{ ctx.beginPath(); ctx.moveTo(upper.start.x, upper.start.y); ctx.lineTo(upper.end.x, upper.end.y); ctx.stroke(); }, OVERLAY.plot, 2.4, 5.4);
      haloStroke(ctx, ()=>{ ctx.beginPath(); ctx.moveTo(CHART.plotLeft, pt.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); }, OVERLAY.plot, 1.6, 4);
    }
  }
  for(const p of points){
    const pt=pos(p.weightKg,p.cgMm);
    if(crosshair){
      ctx.save(); ctx.setLineDash([7,6]);
      haloStroke(ctx, ()=>{ ctx.beginPath(); ctx.moveTo(CHART.plotLeft, pt.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); }, OVERLAY.cross, 1.4, 3.6);
      ctx.restore();
    }
    ctx.save();
    ctx.fillStyle=OVERLAY.halo; ctx.strokeStyle=OVERLAY.ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,6.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=OVERLAY.plot; ctx.beginPath(); ctx.arc(pt.x,pt.y,2.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=OVERLAY.ink; ctx.font="bold 11px IBM Plex Sans, Arial, sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.strokeStyle=OVERLAY.halo; ctx.lineWidth=3;
    ctx.strokeText(String(p.id), pt.x, pt.y-12); ctx.fillText(String(p.id), pt.x, pt.y-12);
    ctx.restore();
  }
}
function draw(){
  const w=CHART.imageWidth, h=CHART.imageHeight, dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  drawTo(ctx);
  const legend=document.getElementById("legend"), list=document.getElementById("legendList");
  if(!points.length){ legend.style.display="none"; }
  else {
    legend.style.display="block";
    list.innerHTML=points.map(p=>`
      <li class="legend-item">
        <span><strong>P${p.id}</strong> &nbsp; ${p.weightKg.toFixed(1)} kg (${kgToLb(p.weightKg).toFixed(1)} lb) &nbsp; ${p.cgMm.toFixed(1)} mm (${mmToIn(p.cgMm).toFixed(3)} in) &nbsp; <span class="zone ${isNoBallast(pos(p.weightKg, p.cgMm).x, pos(p.weightKg, p.cgMm).y) ? 'noballast' : 'ballast'}" style="padding: 1px 4px; font-size: 0.7rem;">${isNoBallast(pos(p.weightKg, p.cgMm).x, pos(p.weightKg, p.cgMm).y) ? 'NO BALLAST' : 'BALLAST'}</span></span>
        <button type="button" class="del-pt" data-id="${p.id}" title="Delete point P${p.id}">✕</button>
      </li>
    `).join("");
    list.querySelectorAll(".del-pt").forEach(btn => {
      btn.onclick = (e) => {
        const id = parseInt(e.currentTarget.getAttribute("data-id"), 10);
        points = points.filter(pt => pt.id !== id);
        if (!points.length) nextId = 1;
        draw();
      };
    });
  }
}
function applyZoom(){ stage.style.width=(CHART.imageWidth*zoom)+"px"; stage.style.height=(CHART.imageHeight*zoom)+"px"; draw(); }

function printGraph(){
  const pad=24, extra=points.length? 18+16+points.length*22+12 : 0;
  const pr=2;
  const c=document.createElement("canvas");
  c.width=Math.round((CHART.imageWidth+pad*2)*pr);
  c.height=Math.round((CHART.imageHeight+extra+pad*2)*pr);
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  ctx.scale(pr,pr); ctx.translate(pad,pad);
  ctx.drawImage(img,0,0,CHART.imageWidth,CHART.imageHeight);
  drawTo(ctx);
  if(points.length){
    const y0=CHART.imageHeight;
    ctx.fillStyle="#fff"; ctx.fillRect(0,y0,CHART.imageWidth,extra);
    ctx.fillStyle="#111"; ctx.font="bold 11px IBM Plex Sans, Arial, sans-serif";
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText("Plotted points", 36, y0+16);
    ctx.font="13px ui-monospace, monospace";
    points.forEach((p,i)=>{
      const y=y0+18+22+i*22;
      ctx.fillStyle=OVERLAY.plot; ctx.beginPath(); ctx.arc(42,y,4.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#111";
      ctx.fillText(`P${p.id}   ${p.weightKg.toFixed(1)} kg   ${kgToLb(p.weightKg).toFixed(1)} lb   ${p.cgMm.toFixed(1)} mm   ${mmToIn(p.cgMm).toFixed(3)} in`, 54, y);
    });
  }
  const url=c.toDataURL("image/png");
  const sheet=document.getElementById("printSheet");
  sheet.innerHTML="";
  const im=new Image();
  const doPrint = () => {
    document.body.classList.add("is-printing");
    window.print();
  };
  im.onload = doPrint;
  im.alt="AS350 B3e Figure 1/3 with plotted points";
  im.src=url;
  if (im.complete) {
    doPrint();
  }
  sheet.appendChild(im);
}
window.addEventListener("afterprint", ()=> document.body.classList.remove("is-printing"));

document.getElementById("exportBtn").onclick = () => {
  if (!points.length) {
    alert("No points to export.");
    return;
  }
  const rows = [
    ["Point", "Weight (kg)", "Weight (lb)", "CG (mm)", "CG (in)", "Flight Zone"],
  ];
  for (const p of points) {
    const pt = pos(p.weightKg, p.cgMm);
    rows.push([
      `P${p.id}`,
      p.weightKg.toFixed(1),
      kgToLb(p.weightKg).toFixed(1),
      p.cgMm.toFixed(1),
      mmToIn(p.cgMm).toFixed(3),
      isNoBallast(pt.x, pt.y) ? "NO BALLAST" : "BALLAST",
    ]);
  }
  const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  a.download = `AS350_B3e_Weight_Balance_${Date.now()}.csv`;
  a.click();
};

document.getElementById("plotBtn").onclick=()=>{
  const {weightKg,cgMm}=getInputs();
  if(isNaN(weightKg)||isNaN(cgMm)) return;
  points.push({id:nextId++, weightKg, cgMm});
  draw(); updateCurrent();
};
document.getElementById("clearLast").onclick=()=>{ points.pop(); if(!points.length) nextId=1; draw(); };
document.getElementById("clearAll").onclick=()=>{ points=[]; nextId=1; draw(); };
["connect","crosshair","showCgLine"].forEach(id=> document.getElementById(id).onchange=draw);
document.getElementById("zoomIn").onclick=()=>{ zoom=Math.min(3, zoom+0.25); applyZoom(); };
document.getElementById("zoomOut").onclick=()=>{ zoom=Math.max(0.5, zoom-0.25); applyZoom(); };
document.getElementById("zoomReset").onclick=()=>{ zoom=1; applyZoom(); };
document.getElementById("printBtn").onclick=printGraph;
["weight","cg"].forEach(id=>{
  document.getElementById(id).oninput=updateCurrent;
  document.getElementById(id).onchange=updateCurrent;
});
img.onload=()=>{ applyZoom(); updateCurrent(); };
if(img.complete){ applyZoom(); updateCurrent(); }
</script>
</body>
</html>
