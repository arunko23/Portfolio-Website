name = "portfolio-website"
compatibility_date = "2024-03-20"
pages_build_output_dir = "."

# Cloudflare D1 — SQLite database for locations, submissions, risks
[[d1_databases]]
binding = "DB"
database_name = "maplocate_db"
database_id = "7b24fb43-df0b-4d55-9b00-0f9f61820e94"

# ImageKit credentials are stored as Cloudflare Pages encrypted secrets —
# never in this file. Configure them via the Cloudflare Dashboard or CLI:
#   wrangler pages secret put IMAGEKIT_PRIVATE_KEY
#   wrangler pages secret put IMAGEKIT_PUBLIC_KEY
#   wrangler pages secret put IMAGEKIT_URL_ENDPOINT
